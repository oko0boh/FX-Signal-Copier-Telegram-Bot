[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crt-robot"
version = "0.1.0"
description = "Candle Range Theory research robot: data, primitives, backtester"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["crt_robot*"]

[tool.pytest.ini_options]
testpaths = ["crt_robot/tests"]
addopts = "-q"
markers = ["network: needs internet access to data hosts (skipped by default)"]
